<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Thêm danh mục mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow px-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2" th:href="@{/admin/dashboard}">
            <i class="fa-solid fa-book-open"></i> BOOKSHOP Admin
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small">
                Xin chào, <b th:text="${session.username}">Admin</b>
            </span>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <!-- Sidebar -->
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9">
            <div class="bg-white p-4 rounded shadow-sm">
                <h3 class="fw-bold mb-4 text-dark border-bottom pb-2">
                    <i class="fa-solid fa-plus-circle text-success"></i> Thêm danh mục mới
                </h3>

                <form th:action="@{/admin/categories/create}" th:object="${category}" method="post">
                    <div class="row g-3">
                        <!-- Category Name -->
                        <div class="col-12">
                            <label for="name" class="form-label fw-semibold">Tên danh mục</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required placeholder="Nhập tên danh mục (ví dụ: Sách khoa học)">
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label for="description" class="form-label fw-semibold">Mô tả danh mục</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Nhập mô tả ngắn gọn về danh mục..."></textarea>
                        </div>

                        <!-- Actions -->
                        <div class="col-12 d-flex gap-2 justify-content-end mt-4">
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary px-4 fw-bold">Hủy bỏ</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm">Thêm danh mục</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
