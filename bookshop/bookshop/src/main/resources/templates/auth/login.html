<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - BOOKSHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="auth-container">
    <div class="card border-0 shadow-lg p-4 bg-white rounded-4" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <div class="auth-logo-icon mb-2"><i class="fa-solid fa-book-open"></i></div>
            <h3 class="fw-bold text-dark mb-1">Chào mừng quay trở lại</h3>
            <p class="text-secondary small">Đăng nhập tài khoản BOOKSHOP của bạn</p>
        </div>

        <div th:if="${param.success}" class="alert alert-success d-flex align-items-center gap-2 py-2" role="alert">
            <i class="fa-solid fa-circle-check"></i> Đăng ký thành công! Hãy đăng nhập.
        </div>

        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert" th:text="${error}">
            Tài khoản hoặc mật khẩu không chính xác.
        </div>

        <form th:action="@{/auth/login}" method="post">
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                Đăng nhập <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-secondary small mb-0">
                Chưa có tài khoản? 
                <a th:href="@{/auth/register}" class="text-primary fw-bold text-decoration-none hover-underline">Đăng ký ngay</a>
            </p>
            <div class="mt-3">
                <a th:href="@{/}" class="text-secondary text-decoration-none small"><i class="fa-solid fa-house"></i> Quay lại cửa hàng</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
