<div th:fragment="content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/category/{id}(id=${book.category.id})}" class="text-decoration-none text-muted" th:text="${book.category.name}">Danh mục</a></li>
            <li class="breadcrumb-item active text-dark" aria-current="page" th:text="${book.title}">Tên sách</li>
        </ol>
    </nav>

    <div class="row g-4 mt-2">
        <!-- Book Image Cover -->
        <div class="col-md-5 col-lg-4 text-center">
            <div class="card border-0 shadow-sm overflow-hidden p-2 bg-white rounded">
                <img th:src="${book.imageUrl != null ? book.imageUrl : '/images/default.png'}"
                     alt="Book cover" class="img-fluid rounded shadow-sm w-100" style="max-height: 420px; object-fit: cover;" onerror="this.src='/images/default.png'">
            </div>
        </div>

        <!-- Book Details -->
        <div class="col-md-7 col-lg-8">
            <div class="bg-white p-4 rounded shadow-sm h-100 d-flex flex-column justify-content-between">
                <div>
                    <h2 class="fw-bold mb-1" th:text="${book.title}">Tên sách</h2>
                    <p class="text-muted mb-3 fs-5" th:text="'Tác giả: ' + ${book.author}"></p>
                    
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <span class="badge bg-primary px-3 py-2" th:text="${book.category.name}">Văn học</span>
                        <span class="badge bg-success px-3 py-2" th:text="'Còn lại: ' + ${book.quantity != null ? book.quantity : 0} + ' cuốn'">Còn hàng</span>
                    </div>

                    <div class="py-3 border-top border-bottom my-3">
                        <span class="fs-2 fw-bold text-danger" th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                    </div>

                    <!-- Add to Cart Form -->
                    <form th:action="@{/cart/add}" method="post" class="mt-4">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <label for="quantity" class="fw-bold text-secondary m-0">Số lượng:</label>
                            <input type="number" id="quantity" name="quantity" value="1" min="1" 
                                   th:max="${book.quantity != null ? book.quantity : 99}" 
                                   class="form-control text-center" style="width: 80px;">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg px-4 py-2 d-flex align-items-center gap-2 shadow-sm">
                                <i class="fa-solid fa-cart-shopping"></i> Thêm vào giỏ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Description -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="bg-white p-4 rounded shadow-sm">
                <h4 class="fw-bold pb-2 border-bottom mb-3"><i class="fa-solid fa-circle-info text-primary"></i> Mô tả sản phẩm</h4>
                <p class="text-secondary" style="line-height: 1.8; white-space: pre-line;" 
                   th:text="${book.description != null and !book.description.trim().isEmpty() ? book.description : 'Thông tin chi tiết về cuốn sách này đang được cập nhật.'}"></p>
            </div>
        </div>
    </div>

    <!-- Related Books -->
    <div class="row mt-4" th:if="${relatedBooks != null and relatedBooks.size() > 1}">
        <div class="col-12">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-star text-warning"></i> Sách cùng thể loại</h4>
            <div class="row g-3">
                <div class="col-6 col-md-4 col-lg-3" th:each="rBook : ${relatedBooks}" th:if="${rBook.id != book.id}">
                    <div class="card h-100 shadow-sm border-0 bg-white">
                        <a th:href="@{/book/{id}(id=${rBook.id})}">
                            <img th:src="${rBook.imageUrl != null ? rBook.imageUrl : '/images/default.png'}"
                                 class="card-img-top" alt="Cover" style="height: 180px; object-fit: cover;" onerror="this.src='/images/default.png'">
                        </a>
                        <div class="card-body p-2">
                            <a th:href="@{/book/{id}(id=${rBook.id})}" class="text-decoration-none text-dark">
                                <h6 class="card-title fw-bold text-truncate mb-1" th:text="${rBook.title}">Related Title</h6>
                            </a>
                            <div class="text-danger fw-bold small" th:text="${#numbers.formatDecimal(rBook.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
