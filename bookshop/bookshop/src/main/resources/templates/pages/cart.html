<div th:fragment="content">
    <div class="row g-4 mt-2">
        <div class="col-12">
            <h3 class="fw-bold mb-3"><i class="fa-solid fa-cart-shopping text-warning"></i> Giỏ hàng của bạn</h3>
        </div>

        <div class="col-lg-8" th:if="${cartItems != null and !cartItems.isEmpty()}">
            <div class="bg-white rounded shadow-sm p-3 table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr class="text-secondary" style="font-size: 0.85rem; border-bottom: 2px solid #eee;">
                            <th>Sách</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Tổng tiền</th>
                            <th class="text-center">Xóa</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td class="d-flex align-items-center gap-3">
                                <img th:src="${item.book.imageUrl != null ? item.book.imageUrl : '/images/default.png'}" 
                                     alt="Book Thumbnail" class="rounded shadow-sm" style="width: 50px; height: 70px; object-fit: cover;" onerror="this.src='/images/default.png'">
                                <div>
                                    <a th:href="@{/book/{id}(id=${item.book.id})}" class="text-decoration-none text-dark fw-bold" th:text="${item.book.title}">Tên sách</a>
                                    <div class="text-muted small" th:text="${item.book.author}">Tác giả</div>
                                </div>
                            </td>
                            <td>
                                <span class="fw-medium text-dark" th:text="${#numbers.formatDecimal(item.book.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                            </td>
                            <td>
                                <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-1">
                                    <input type="hidden" name="bookId" th:value="${item.book.id}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="1" 
                                           class="form-control text-center" style="width: 65px; padding: 0.375rem 0.25rem;" 
                                           onchange="this.form.submit()">
                                </form>
                            </td>
                            <td>
                                <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(item.amount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/cart/remove/{bookId}(bookId=${item.book.id})}" class="btn btn-outline-danger btn-sm rounded-circle" style="width: 32px; height: 32px; padding: 0;">
                                    <i class="fa-solid fa-trash-can" style="font-size: 0.85rem; line-height: 32px;"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-3">
                    <a th:href="@{/}" class="btn btn-outline-primary"><i class="fa-solid fa-arrow-left"></i> Tiếp tục mua sắm</a>
                    <a th:href="@{/cart/clear}" class="btn btn-outline-secondary" onclick="return confirm('Bạn có chắc muốn làm trống giỏ hàng?')"><i class="fa-solid fa-trash"></i> Xóa tất cả</a>
                </div>
            </div>
        </div>

        <!-- Cart Summary Card -->
        <div class="col-lg-4" th:if="${cartItems != null and !cartItems.isEmpty()}">
            <div class="bg-white rounded shadow-sm p-4">
                <h5 class="fw-bold mb-4 border-bottom pb-2">Tóm tắt đơn hàng</h5>
                <div class="d-flex justify-content-between mb-3 text-secondary">
                    <span>Tổng tiền sách:</span>
                    <span th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                </div>
                <div class="d-flex justify-content-between mb-4 text-secondary">
                    <span>Phí vận chuyển:</span>
                    <span class="text-success fw-bold">MIỄN PHÍ</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4 align-items-center">
                    <span class="fw-bold fs-5">Thành tiền:</span>
                    <span class="fw-bold fs-4 text-danger" th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                </div>

                <a th:href="@{/order/checkout}" class="btn btn-primary w-100 btn-lg shadow-sm d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-solid fa-credit-card"></i> Tiến hành thanh toán
                </a>
            </div>
        </div>

        <!-- Empty State -->
        <div class="col-12 py-5 text-center bg-white rounded shadow-sm" th:if="${cartItems == null or cartItems.isEmpty()}">
            <div class="fs-1 mb-2">🛒</div>
            <h4 class="fw-bold text-dark">Giỏ hàng của bạn đang trống!</h4>
            <p class="text-muted">Hãy lấp đầy nó bằng những cuốn sách tuyệt vời.</p>
            <a th:href="@{/}" class="btn btn-primary px-4 mt-3">Mua sắm ngay</a>
        </div>
    </div>
</div>
