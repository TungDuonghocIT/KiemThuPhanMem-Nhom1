<div th:fragment="content">
    <div class="row g-4 mt-2">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <h3 class="fw-bold mb-0">
                <i class="fa-solid fa-receipt text-warning"></i> Chi tiết đơn hàng <span th:text="'#' + ${order.id}">#1</span>
            </h3>
            <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-chevron-left"></i> Lịch sử đơn hàng
            </a>
        </div>

        <!-- Recipient Info & Status -->
        <div class="col-md-4">
            <div class="bg-white rounded shadow-sm p-4 h-100">
                <h5 class="fw-bold mb-3 border-bottom pb-2">Thông tin nhận hàng</h5>
                <p class="mb-2"><strong class="text-secondary">Họ tên:</strong> <span class="text-dark" th:text="${order.fullname}">Name</span></p>
                <p class="mb-2"><strong class="text-secondary">Điện thoại:</strong> <span class="text-dark" th:text="${order.phone}">Phone</span></p>
                <p class="mb-3"><strong class="text-secondary">Địa chỉ:</strong> <span class="text-dark" th:text="${order.address}">Address</span></p>
                
                <h5 class="fw-bold mb-3 border-bottom pb-2 pt-2">Trạng thái</h5>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge fs-6 px-3 py-2" 
                          th:classappend="${order.status == 'PENDING' ? 'bg-warning text-dark' : 
                                           (order.status == 'CONFIRMED' ? 'bg-primary' : 
                                           (order.status == 'DELIVERED' ? 'bg-success' : 'bg-danger'))}"
                          th:text="${order.status == 'PENDING' ? 'Đang xử lý' : 
                                    (order.status == 'CONFIRMED' ? 'Đã xác nhận' : 
                                    (order.status == 'DELIVERED' ? 'Đã giao hàng' : 'Đã hủy'))}">
                        PENDING
                    </span>
                </div>
            </div>
        </div>

        <!-- Order Items -->
        <div class="col-md-8">
            <div class="bg-white rounded shadow-sm p-4 table-responsive">
                <h5 class="fw-bold mb-3 border-bottom pb-2">Sản phẩm đã mua</h5>
                <table class="table align-middle">
                    <thead>
                        <tr class="text-secondary" style="font-size: 0.85rem;">
                            <th>Sách</th>
                            <th>Giá</th>
                            <th class="text-center">Số lượng</th>
                            <th class="text-end">Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td class="d-flex align-items-center gap-3">
                                <img th:src="${item.book != null and item.book.imageUrl != null ? item.book.imageUrl : '/images/default.png'}" 
                                     alt="Book Thumbnail" class="rounded shadow-sm" style="width: 40px; height: 55px; object-fit: cover;" onerror="this.src='/images/default.png'">
                                <div>
                                    <span class="fw-bold text-dark" th:text="${item.book != null ? item.book.title : 'Sách đã xóa'}">Tên sách</span>
                                    <div class="text-muted small" th:text="${item.book != null ? item.book.author : ''}">Tác giả</div>
                                </div>
                            </td>
                            <td>
                                <span class="text-dark" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                            </td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end fw-bold text-danger" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                        </tr>
                    </tbody>
                </table>

                <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-3">
                    <span class="fw-bold text-dark fs-5">Thành tiền:</span>
                    <span class="fw-bold text-danger fs-4" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                </div>
            </div>
        </div>
    </div>
</div>
