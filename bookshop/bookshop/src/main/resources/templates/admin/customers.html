<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Quản lý khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow px-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2" th:href="@{/admin/dashboard}">
            <i class="fa-solid fa-book-open"></i> BOOKSHOP Admin
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small">
                Xin chào, <b th:text="${session.username}">Admin</b>
            </span>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <!-- Sidebar -->
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9">
            <div class="bg-white p-4 rounded shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-users text-primary"></i> Quản lý khách hàng</h3>
                </div>

                <!-- Search Bar -->
                <form class="d-flex w-50 mb-4" th:action="@{/admin/customers}" method="get">
                    <div class="input-group shadow-sm">
                        <input class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên, username, email..." aria-label="Search">
                        <button class="btn btn-primary" type="submit">
                            <i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm
                        </button>
                        <a th:href="@{/admin/customers}" class="btn btn-outline-secondary" th:if="${keyword != null and !keyword.isEmpty()}">Reset</a>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Họ tên</th>
                                <th>Tên đăng nhập</th>
                                <th>Email</th>
                                <th>Số điện thoại</th>
                                <th>Địa chỉ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="customer : ${customers}">
                                <td><b th:text="${customer.fullname}">Full Name</b></td>
                                <td th:text="${customer.username}">Username</td>
                                <td th:text="${customer.email}">Email</td>
                                <td th:text="${customer.phone}">Phone</td>
                                <td th:text="${customer.address}">Address</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(customers)}">
                                <td colspan="5" class="text-center text-secondary py-4">Không tìm thấy khách hàng nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-4" th:if="${totalPages > 1}">
                    <div class="text-secondary small">
                        Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/admin/customers(page=${currentPage - 1}, size=${size}, keyword=${keyword})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active' : ''">
                                <a class="page-link" th:href="@{/admin/customers(page=${i}, size=${size}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/admin/customers(page=${currentPage + 1}, size=${size}, keyword=${keyword})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
