<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Quản lý đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow px-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2" th:href="@{/admin/dashboard}">
            <i class="fa-solid fa-book-open"></i> BOOKSHOP Admin
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small">
                Xin chào, <b th:text="${session.username}">Admin</b>
            </span>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <!-- Sidebar -->
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9">
            <div class="bg-white p-4 rounded shadow-sm">
                <h3 class="fw-bold mb-4 text-dark"><i class="fa-solid fa-receipt text-primary"></i> Quản lý đơn hàng</h3>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Ngày đặt</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td><b th:text="'#' + ${order.id}">#1</b></td>
                                <td>
                                    <div class="fw-bold" th:text="${order.fullname}">Customer</div>
                                    <div class="text-secondary small" th:text="${order.phone}">Phone</div>
                                    <div class="text-secondary small text-truncate" style="max-width: 200px;" th:text="${order.address}">Address</div>
                                </td>
                                <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">Date</td>
                                <td><b class="text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</b></td>
                                <td>
                                    <form th:action="@{/admin/orders/update-status}" method="post" class="d-flex gap-1 align-items-center">
                                        <input type="hidden" name="orderId" th:value="${order.id}">
                                        <select name="status" class="form-select form-select-sm" style="width: 140px;" onchange="this.form.submit()">
                                            <option value="PENDING" th:selected="${order.status == 'PENDING'}">Chờ xử lý</option>
                                            <option value="CONFIRMED" th:selected="${order.status == 'CONFIRMED'}">Đã xác nhận</option>
                                            <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">Đã giao hàng</option>
                                            <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">Đã hủy</option>
                                        </select>
                                    </form>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/orders/delete/{id}(id=${order.id})}" class="btn btn-outline-danger btn-sm fw-bold" onclick="return confirm('Bạn có chắc chắn muốn xóa đơn hàng này không?');">
                                        <i class="fa-solid fa-trash"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="6" class="text-center text-secondary py-4">Chưa có đơn hàng nào được đặt.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-4" th:if="${totalPages > 1}">
                    <div class="text-secondary small">
                        Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/admin/orders(page=${currentPage - 1}, size=${size})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active' : ''">
                                <a class="page-link" th:href="@{/admin/orders(page=${i}, size=${size})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/admin/orders(page=${currentPage + 1}, size=${size})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
