<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow px-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2" th:href="@{/admin/dashboard}">
            <i class="fa-solid fa-book-open"></i> BOOKSHOP Admin
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small">
                Xin chào, <b th:text="${session.username}">Admin</b>
            </span>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <!-- Sidebar -->
        <div class="col-md-3">
            <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9">
            <div class="bg-white p-4 rounded shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-list-ul text-primary"></i> Danh sách danh mục</h3>
                    <a th:href="@{/admin/categories/create}" class="btn btn-success px-4 fw-bold shadow-sm d-flex align-items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Thêm danh mục mới
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 10%">ID</th>
                                <th style="width: 30%">Tên danh mục</th>
                                <th style="width: 40%">Mô tả</th>
                                <th style="width: 20%" class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.id}">1</td>
                                <td><b th:text="${cat.name}">Name</b></td>
                                <td th:text="${cat.description}">Description</td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2">
                                        <a th:href="@{/admin/categories/update/{id}(id=${cat.id})}" class="btn btn-outline-warning btn-sm fw-bold">
                                            <i class="fa-solid fa-pen-to-square"></i> Sửa
                                        </a>
                                        <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" class="btn btn-outline-danger btn-sm fw-bold" onclick="return confirm('Chú ý: Tất cả sách thuộc danh mục bị xóa sẽ tự động chuyển về thể loại chưa phân loại. Bạn có chắc chắn muốn xóa?');">
                                            <i class="fa-solid fa-trash"></i> Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
